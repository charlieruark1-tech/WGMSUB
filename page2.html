<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Classroom</title>
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400..700&display=swap"
            rel="stylesheet"
        />
        <link rel="icon" type="image/png" href="Rizzler.png" sizes="32x32" />
        <style>
            body {
                background-color: rgb(246, 115, 115);
            }
            #arrows {
                width: 50px;
                height: 50px;
                background-image: url(leftarrow.png);
                background-size: contain;
                border-radius: 10px;
                left: 38%;
                position: absolute;
                top: 28px;
                background-color: rgb(115, 246, 115);
                transition: transform 0.3s ease-in-out;
                outline-color: darkgreen;
                border: none;
            }

            #arrows:hover {
                transform: scale(1.1);
            }

            #topbr {
                width: 200vh;
                height: 100px;
                background-color: rgb(152, 255, 97);
                text-align: center;
                font-size: 80px;
                font-family: "Pixelify Sans", sans-serif;
            }
            #buttons {
                width: 100px;
                height: 100px;
                position: relative;
                top: 10px;
                border-radius: 10px;
                border: none;
                background-size: 100px 100px;
                justify-content: center;
                align-items: center;
                transition: transform 0.3s ease-in-out;
            }
            #buttons:hover {
                transform: scale(1.1);
            }
        </style>
        <script>
            const originalTitle = document.title;

            document.addEventListener("visibilitychange", () => {
                if (document.hidden) {
                    document.title = "New Tab";
                } else {
                    document.title = originalTitle;
                }
            });
            function openCloaked() {
                var win = window.open(); // Opens a new about:blank window
                var url = "https://charlieruark1-tech.github.io/WGMSUB/page3.html"; // Replace with your target URL

                var iframe = win.document.createElement("iframe");
                iframe.style.width = "100%";
                iframe.style.height = "100%";
                iframe.style.border = "none";
                iframe.src = url;

                win.document.body.appendChild(iframe);
            }
        </script>
    </head>
    <body>
        <div id="topbr">
            Page 2
            <a href="index.html" style="text-decoration: none; color: inherit">
                <button id="arrows"></button>
            </a>
            <a href="page3.html"
                ><button style="left: 63%; background-image: url(right\ arrow.png)" id="arrows"></button
            ></a>
        </div>
        <a href="/stickmn/index.html">
            <button id="buttons" title="Sticman dismounting" style="background-image: url(stickpng.png)"></button>
        </a>
        <button onclick="openCloaked()">Cloak</button>
    </body>
</html>
